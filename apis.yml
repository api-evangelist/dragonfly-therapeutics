aid: dragonfly-therapeutics
name: Dragonfly Therapeutics
description: 'Dragonfly Therapeutics is a clinical-stage biotechnology company based in Waltham,
  Massachusetts, founded in 2016 by Tyler Jacks, Bill Haney and David Raulet to develop natural
  killer (NK) cell-based immunotherapies. Its proprietary TriNKET (Tri-specific NK cell Engager
  Therapy) and cytokine engager platforms produce molecules that bind both a tumor or disease
  antigen and an NK cell activating receptor, recruiting innate and adaptive immunity against
  cancer, autoimmune disease, fibrosis and neuro-inflammation. Lead clinical candidate DF1001
  targets HER2 in advanced solid tumors, and the platform is licensed under multi-target
  collaborations with AbbVie, Bristol Myers Squibb, Merck and Gilead. Dragonfly is a therapeutics
  developer rather than a software company: it publishes no developer program, no public API,
  no SDKs and no machine-readable API contract. The only agent-readable surfaces on its own host
  are the llms.txt and Model Context Protocol endpoint automatically provisioned by its Wix
  website platform.'
