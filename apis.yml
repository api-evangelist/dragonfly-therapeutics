apis:
- name: Dragonfly Therapeutics Site MCP
  description: 'Model Context Protocol endpoint served from the Dragonfly Therapeutics website
    host. This is a platform-provided surface automatically provisioned by Wix for every site it
    builds — not a first-party Dragonfly Therapeutics product API. It answers an unauthenticated
    JSON-RPC 2.0 tools/list with nine tools that let an agent read business details, search site
    content, obtain a visitor token and call Wix site APIs on a visitor''s behalf. Verified live
    on 2026-08-12: tools/list returned HTTP 200 with real inputSchema per tool, and a
    GetBusinessDetails call returned the site''s business record.'
